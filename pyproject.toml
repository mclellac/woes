[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "woes"
version = "0.99.0"
description = "A simple GTK application"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # PyGObject removed to rely on system version
    "requests",
    "dnspython", # Added dnspython here as it's a direct project dependency
    "PyYAML"     # Added PyYAML here as it's a direct project dependency
]

[project.scripts]
woes = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]      # search for packages in the current directory
include = ["src*"] # include all packages under src
namespaces = false # do not support namespace packages

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "build",
    ".flatpak-builder",
    "venv",
]

# General configuration options
line-length = 120
indent-width = 4

# Target Python version
target-version = "py310"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "D", "B", "ARG"]
ignore = [
    "E402", # Module level import not at top of file (often needed with Gtk gi.require_version)
    "D203", # Conflicts with D211
    "D212", # Conflicts with D213
    "E722", # Do not use bare `except:` (broad-except) (formerly B001)
    "PLR0914", # too-many-locals
]

# Allow fixes for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in docstrings.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
"src/dns_page.py" = ["C901"]
"src/http_page.py" = ["E501"]
"src/main.py" = ["SLF001"]
